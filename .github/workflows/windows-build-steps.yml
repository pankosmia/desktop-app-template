name: Windows x64 Build

on:
  workflow_call:
    inputs:
      runner:
        description: 'The GitHub runner to use (e.g., windows-2022, windows-2025)'
        required: true
        type: string
      branches:
        required: true
        type: string
      branch_name_exception:
        description: 'Branch name exception (optional):'
        required: false
        type: string
      timestamp:
        description: 'Build-order timestamp computed once in the setup job'
        required: true
        type: string
      artifact_suffix:
        description: 'Artifact name identifier (optional)'
        required: false
        type: string
        default: ''
    outputs:
      zip-name:
        description: "Name of the generated CLI ZIP file"
        value: ${{ jobs.build.outputs.zip-name }}
      electronite-exe-name:
        description: "Name of the generated Electronite installer EXE file"
        value: ${{ jobs.build.outputs.electronite-exe-name }}
      zip-portable-name:
        description: "Name of the generated Portable ZIP file"
        value: ${{ jobs.build.outputs.zip-portable-name }}

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    outputs:
      zip-name: ${{ steps.get-zip-name.outputs.zip-name }}
      electronite-exe-name: ${{ steps.get-electronite-exe-name.outputs.electronite-exe-name }}
      zip-portable-name: ${{ steps.get-zip-portable-name.outputs.zip-portable-name }}

    # Set process.env.CI to false to prevent treating warnings as errors
    env:
      CI: false
      BRANCHES: ${{ inputs.branches }}
      BRANCH_NAME_EXCEPTION: ${{ inputs.branch_name_exception }}

    steps:
      # Show branches
      - name: Show BRANCHES
        run: |
          echo "BRANCHES = $env:BRANCHES"
          if ($env:BRANCH_NAME_EXCEPTION) {
            echo "Branch name exception is $env:BRANCH_NAME_EXCEPTION"
          }

      # Turn off re-runs
      - name: No re-runs please
        run: |
         if ( ${{ github.run_attempt }} -gt 1 ) {
            echo "No re-runs. They use the commit SHA and git ref of the original event that triggered the workflow run. However, that does not extend to client and resource repos which may expect a more recent panksomia-web."
            echo "Start a new workflow run instead."
            exit 1
          } else {
            echo "NOT a re-run"
          }

      # Install Inno Setup
      - name: Install Inno Setup
        run: choco install innosetup

      # Rust
      - name: Set up Rust
        id: set-up-rust
        uses: moonrepo/setup-rust@v1
        timeout-minutes: 15  # Adjust the value as needed

      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # Specify pnpm version
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      # Specify node.js version
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.11.0'
          # cache: pnpm

      # Add suffix to version
      - name: Run gha_ver_suffix.bat
        working-directory: .\windows\install
        run: .\gha_ver_suffix.bat "${{ inputs.artifact_suffix != '' && format('{0}-{1}', inputs.artifact_suffix, inputs.timestamp) || inputs.timestamp }}" "${{ inputs.branches }}"

      # Set APP_TIER and APP_VERSION from app_config.json
      - name: Extract APP_VERSION from app_config.json
        id: get_app_version
        run: |
          $APP_CONFIG  = Get-Content .\app_config.json -Raw | ConvertFrom-Json
          $tier = $env:BRANCHES
          $m = @($APP_CONFIG.app.version | Where-Object { $_.branches -contains $tier })
          if ($m.Count -ne 1) { throw "app.version must have exactly one entry for tier '$tier', found $($m.Count)" }
          $version = $m[0].value
          echo "APP_TIER=$tier"       | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "APP_TIER=$tier"
          echo "APP_VERSION=$version"

      # Set APP_NAME and APP_SHORT_NAME from app_config.json, and define FILE_APP_NAME
      - name: Extract APP_NAME from app_config.json
        id: get_app_name
        run: |
          $APP_CONFIG  = Get-Content .\app_config.json -Raw | ConvertFrom-Json
          $tier = $env:BRANCHES
          function Resolve-Tiered($entries, $label) {
            $m = @($entries | Where-Object { $_.branches -contains $tier })
            if ($m.Count -ne 1) { throw "$label must have exactly one entry for tier '$tier', found $($m.Count)" }
            $m[0].value
          }
          $appName      = Resolve-Tiered $APP_CONFIG.app.name 'app.name'
          $appShortName = Resolve-Tiered $APP_CONFIG.app.short_name 'app.short_name'
          $fileAppName  = $appName.ToLower().Replace(" ", "-")
          echo "APP_NAME=$appName"           | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "FILE_APP_NAME=$fileAppName"  | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "APP_SHORT_NAME=$appShortName" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "APP_NAME=$appName"
          echo "FILE_APP_NAME=$fileAppName"
          echo "APP_SHORT_NAME=$appShortName"

      # Install the repository
      - name: Install this repo
        run: pnpm install

      # Clone resources and clients
      - name: Run clone.bat
        working-directory: .\windows\scripts
        run: .\clone.bat "$env:BRANCHES"

      # Confirm Node architecture
      - name: Check Node arch
        shell: pwsh
        run: node -p "process.arch"

      # Install and build clients with a branch name exception
      - name: Build ${{ inputs.branches }} clients except where ${{ inputs.branch_name_exception }} exists
        if: ${{ inputs.branch_name_exception != '' }}
        working-directory: .\windows\scripts
        run: .\build_clients.bat -f "$env:BRANCH_NAME_EXCEPTION" "$env:BRANCHES"

      # Install and build clients without a branch name exception
      - name: Build ${{ inputs.branches }} clients
        if: ${{ inputs.branch_name_exception == '' }}
        working-directory: .\windows\scripts
        run: .\build_clients.bat -f "$env:BRANCHES"

      # Build RELEASE server and assemble build environment without asking if the server is off
      - name: Run ${{ inputs.branches }} RELEASE server and assemble build environment without asking if the server is off
        working-directory: .\windows\scripts
        run: .\build_server.bat -s "$env:BRANCHES"

      # Bundle zip without asking if the server is off and indicate GHA
      - name: Run bundle_zip.ps1 -ServerOff "Y" -IsGHA "Y"
        working-directory: .\windows\scripts
        run: .\bundle_zip.ps1 -ServerOff "Y" -IsGHA "Y" -Tier "$env:BRANCHES"

      # Get names for zip artifact
      - name: Get names for zip artifact
        id: get-zip-name
        run: |
          echo "Zip for cli name:"
          $ZIP_NAME = Get-ChildItem -Path ".\releases\windows\*-cli.zip" -Name
          echo "zip-name=$ZIP_NAME" >> $env:GITHUB_OUTPUT
          echo "ZIP_NAME=$ZIP_NAME" >> $env:GITHUB_ENV

      # Upload zip for cli artifacts
      - name: Upload zip for cli artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ZIP_NAME }}
          path: .\releases\windows\${{ env.ZIP_NAME }}
          archive: false
          if-no-files-found: error
          retention-days: 90

      # Get workspace location and repo name
      - name: Show workspace and repo name
        run: |
          echo "github.event.repository.name: ${{ github.event.repository.name }}"
          echo "github.workspace: ${{ github.workspace }}"

      # Build electronite
      - name: Run makeAllInstallsElectronite.ps1
        working-directory: .\windows\install
        run: .\makeAllInstallsElectronite.ps1 -Tier "$env:BRANCHES"

      # Get names for electronite exe artifacts
      - name: Get names for electronite exe artifact
        id: get-electronite-exe-name
        run: |
          echo "Electronite exe for terminal name:"
          $EXE_NAME = Get-ChildItem -Path ".\releases\windows\*.exe" -Name
          echo "electronite-exe-name=$EXE_NAME" >> $env:GITHUB_OUTPUT
          echo "ELECTRONITE_EXE_NAME=$EXE_NAME" >> $env:GITHUB_ENV

      # Upload electronite exe artifact
      - name: Upload electronite exe artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ELECTRONITE_EXE_NAME }}
          path: .\releases\windows\${{ env.ELECTRONITE_EXE_NAME }}
          archive: false
          if-no-files-found: error
          retention-days: 90

      # Portable App - Bundle viewer without asking if the server is off and indicate GHA -p
      - name: Run bundle_app.ps1 -ServerOff "Y" -IsGHA "Y" -p
        working-directory: .\windows\scripts
        run: .\bundle_app.ps1 -ServerOff "Y" -IsGHA "Y" -p -Tier "$env:BRANCHES"

      # Get names for portable artifact
      - name: Get name for portable app artifact
        id: get-zip-portable-name
        run: |
          echo "Zip for portable app name:"
          $ZIP_PORTABLE_NAME = Get-ChildItem -Path ".\releases\windows\*-portable.zip" -Name
          echo "zip-portable-name=$ZIP_PORTABLE_NAME" >> $env:GITHUB_OUTPUT
          echo "ZIP_PORTABLE_NAME=$ZIP_PORTABLE_NAME" >> $env:GITHUB_ENV

      # Upload zip for portable artifacts
      - name: Upload zip for portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ZIP_PORTABLE_NAME }}
          path: .\releases\windows\${{ env.ZIP_PORTABLE_NAME }}
          archive: false
          if-no-files-found: error
          retention-days: 90
